[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-tlc-streaming-ingestion"
version = "0.1.0"
description = "Metadata-driven streaming ingestion framework"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "PyYAML==6.0.3",
    "pydantic==2.11.7",
    "pytest==8.4.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]